services:
  # Render service types are immutable. This new name provisions a separate
  # CDN-backed static site instead of trying to convert the sleeping Node app.
  - type: web
    runtime: static
    name: tecaigo-pitch-2026-static
    branch: main
    buildCommand: npm ci && npx next build --webpack
    staticPublishPath: ./out
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeployTrigger: commit
